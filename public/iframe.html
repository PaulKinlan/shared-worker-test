<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharedWorker Client Iframe</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    body {
      background: transparent !important;
      padding: 8px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .iframe-card {
      flex: 1;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 16px);
      box-shadow: 3px 3px 0px #000000;
    }
    .iframe-card:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #000000;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h2 {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-black);
      border-bottom: 1px solid var(--border-black);
    }
    .terminal-window {
      flex: 1;
      margin-bottom: 14px;
      min-height: 120px;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.06);
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body>

  <div class="glass-panel iframe-card">
    <div class="header">
      <h2 id="client-title">Iframe Client</h2>
      <span id="status-badge" class="badge badge-success">Connected</span>
    </div>

    <div id="terminal" class="terminal-window">
      <div class="terminal-line">
        <span class="time">[--:--:--]</span>
        <span class="sys-tag">[System]</span>
        <span class="msg-text">Initializing SharedWorker...</span>
      </div>
    </div>

    <div class="controls">
      <form id="message-form" class="flex-row">
        <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
        <button type="submit" class="primary">Send</button>
      </form>
      
      <div class="flex-row">
        <button id="toggle-conn-btn" class="secondary flex-grow" type="button">Disconnect Node</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('id') || `iframe-${Math.random().toString(36).substring(2, 9)}`;
    const clientName = params.get('name') || 'Iframe Node';

    document.getElementById('client-title').textContent = clientName;

    let myWorker = null;
    let workerPort = null;
    let isConnected = false;

    const terminalEl = document.getElementById('terminal');
    const messageInput = document.getElementById('message-input');
    const messageForm = document.getElementById('message-form');
    const toggleConnBtn = document.getElementById('toggle-conn-btn');
    const statusBadge = document.getElementById('status-badge');

    function logToTerminal(sender, text, isSystem = false) {
      const line = document.createElement('div');
      line.className = 'terminal-line';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      const now = new Date();
      timeSpan.textContent = `[${now.toTimeString().split(' ')[0]}]`;

      const tagSpan = document.createElement('span');
      if (isSystem) {
        tagSpan.className = 'sys-tag';
        tagSpan.textContent = '[System]';
      } else {
        tagSpan.className = 'user-tag';
        tagSpan.textContent = `[${sender}]`;
      }

      const textSpan = document.createElement('span');
      textSpan.className = 'msg-text';
      textSpan.textContent = text;

      line.appendChild(timeSpan);
      line.appendChild(tagSpan);
      line.appendChild(textSpan);
      terminalEl.appendChild(line);

      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    function initSharedWorker() {
      if (typeof SharedWorker === 'undefined') {
        logToTerminal('System', 'Error: SharedWorker not supported.', true);
        statusBadge.className = 'badge badge-danger';
        statusBadge.textContent = 'Unsupported';
        toggleConnBtn.disabled = true;
        return;
      }

      try {
        myWorker = new SharedWorker('worker.js?v=2');
        workerPort = myWorker.port;

        workerPort.onmessage = function(event) {
          const data = event.data;
          
          if (data.type === 'system') {
            if (data.id === clientId) return;
            
            if (data.action === 'connected') {
              logToTerminal('System', `${data.name} joined.`, true);
            } else if (data.action === 'disconnected') {
              logToTerminal('System', `${data.name} left.`, true);
            }
          } 
          else if (data.type === 'message') {
            logToTerminal(data.senderName, data.text);
          }
        };

        workerPort.start();

        workerPort.postMessage({
          type: 'register',
          id: clientId,
          name: clientName
        });

        isConnected = true;
        statusBadge.className = 'badge badge-success';
        statusBadge.textContent = 'Connected';
        toggleConnBtn.textContent = 'Disconnect Node';
        toggleConnBtn.className = 'danger flex-grow';
        
        logToTerminal('System', 'Connected to SharedWorker.', true);
      } catch (err) {
        logToTerminal('System', `Connection failed: ${err.message}`, true);
        console.error(err);
      }
    }

    function disconnectFromWorker() {
      if (workerPort) {
        workerPort.postMessage({ type: 'disconnect' });
        workerPort.close();
      }
      
      isConnected = false;
      statusBadge.className = 'badge badge-danger';
      statusBadge.textContent = 'Offline';
      toggleConnBtn.textContent = 'Reconnect Node';
      toggleConnBtn.className = 'primary flex-grow';
      
      logToTerminal('System', 'Disconnected manually.', true);
    }

    toggleConnBtn.addEventListener('click', () => {
      if (isConnected) {
        disconnectFromWorker();
      } else {
        initSharedWorker();
      }
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      
      if (!text) return;
      
      if (!isConnected) {
        logToTerminal('System', 'Cannot send: Node is offline.', true);
        return;
      }

      workerPort.postMessage({
        type: 'message',
        text: text
      });

      messageInput.value = '';
      messageInput.focus();
    });

    window.addEventListener('beforeunload', () => {
      if (workerPort && isConnected) {
        workerPort.postMessage({ type: 'disconnect' });
      }
    });

    initSharedWorker();
  </script>
</body>
</html>
